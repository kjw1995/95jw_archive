# Hugo configuration file
title: 95JW Archive
baseURL: https://kjw1995.github.io/95jw_archive/

# SEO & Search Console
enableRobotsTXT: true

# git 커밋 이력에서 최종 수정일(.Lastmod)을 가져온다
enableGitInfo: true

# 작성일(.Date)은 frontmatter의 date만 사용하고
# 최종 수정일(.Lastmod)은 git 커밋 날짜를 우선 사용한다
frontmatter:
  date: ["date", "publishDate"]
  lastmod: [":git", "lastmod", "date", "publishDate"]

ignoreFiles:
  - "CLAUDE\\.md$"

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Education
      pageRef: /education
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/kjw1995/95jw_archive"
      params:
        icon: github

params:
  # 페이지 하단에 작성일만 표시 (true로 바꾸면 최종 수정일도 함께 표시)
  displayUpdatedDate: false
  dateFormat: "2006년 1월 2일"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/kjw1995/95jw_archive/edit/main/content"
